name: WATHE poison #102 official upstream fix

on:
  push:
    branches:
      - fix/wathe-poison-102-official
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout workflow
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Checkout the exact released Wathe Extended source
        run: |
          git clone --depth 1 --branch 4.0.0-beta.1-h1.4 https://github.com/rezelyn/Wathe-Extended.git wathe-src

      - name: Apply ONLY rezelyn official poison fix commit e4184bd
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            "https://github.com/rezelyn/Wathe-Extended/commit/e4184bdcb6b51406b92ceaf767123287152b529f.patch" \
            --output poison102-official.patch
          git -C wathe-src apply --check ../poison102-official.patch
          git -C wathe-src apply ../poison102-official.patch
          python3 - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          root = Path("wathe-src")
          config = json.loads((root/"src/main/resources/watheextended.mixins.json").read_text())
          assert "fix.InfectedNullGuardMixin" not in config["mixins"], "Official poison fix missing"
          changes = subprocess.check_output(["git","-C","wathe-src","diff","--name-only"], text=True).splitlines()
          expected = {
              "src/main/java/cat/rezelyn/watheextended/mixin/fix/InfectedNullGuardMixin.java",
              "src/main/resources/watheextended.mixins.json",
          }
          assert set(changes) == expected, f"Unexpected source changes: {changes}"
          print("Official patch applied. No V1/V2/V3 experimental mixins.")
          PY

      - name: Build remapped Fabric JAR
        working-directory: wathe-src
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean build

      - name: Package exact server/client mod JAR
        shell: bash
        run: |
          set -euo pipefail
          test -s wathe-src/build/libs/WatheExtended-4.0.0-beta.1-h1.4.jar
          mkdir -p dist
          cp wathe-src/build/libs/WatheExtended-4.0.0-beta.1-h1.4.jar \
            dist/WatheExtended-4.0.0-beta.1-h1.4-Poison102-OfficialFix.jar

      - name: Upload installable mod
        uses: actions/upload-artifact@v4
        with:
          name: WATHE-Poison-102-official-fix
          path: dist/WatheExtended-4.0.0-beta.1-h1.4-Poison102-OfficialFix.jar
          if-no-files-found: error
